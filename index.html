    <!-- Telegram Mini App SDK — only needed when the app is actually opened
         inside Telegram. Loading it unconditionally cost every web visitor an
         extra cross-origin request on the critical path. -->
    <script>
      (function () {
        try {
          var inTelegram =
            /[?#&]tgWebApp/.test(location.href) ||
            "TelegramWebviewProxy" in window ||
            /Telegram/i.test(navigator.userAgent);
          if (!inTelegram) return;
          // document.write keeps the SDK parser-blocking *inside Telegram only*,
          // so window.Telegram.WebApp is guaranteed to exist before main.tsx
          // reads initData. Web visitors never pay for this request.
          document.write(
            '<script src="https://telegram.org/js/telegram-web-app.js"><\/script>'
          );

        } catch (e) {}
      })();
    </script>

    <!-- LCP-critical fonts only (Space Grotesk + Inter). Trimmed weights + display=swap for instant first paint with system-font fallback. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" /></noscript>
    <!-- Every secondary family in ONE request, injected only AFTER `load` +
         idle. These families are used by inner surfaces (showcase, Arabic UI,
         marketing), never by the first painted frame, so requesting them
         during startup only stole bandwidth from the entry bundle. Skipped
         entirely on Data Saver / 2G connections. -->
    <script>
      (function () {
        var HREF =
          "https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Arabic:wght@400;600;700&family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Readex+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Sora:wght@400;500;600;700;800&family=Archivo+Black&family=Manrope:wght@400;500;600;700&display=swap";
        var EXTRA = "https://db.onlinewebfonts.com/c/e66905e07608167a84e6ad52f638c3c6?family=Helvetica+Now+Var";
        function add(href) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = href;
          document.head.appendChild(l);
        }
        function go() {
          try {
            var c = navigator.connection || {};
            if (c.saveData) return;
            if (/2g/.test(c.effectiveType || "")) return;
          } catch (e) {}
          var run = function () { add(HREF); add(EXTRA); };
          if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 3000 });
          else setTimeout(run, 800);
        }
        if (document.readyState === "complete") go();
        else window.addEventListener("load", go, { once: true });
      })();
    </script>

  <script>
    /* Pre-paint theme so there is no flash. Auth screens are always dark. */
    (function () {
      try {
        var p = location.pathname;
        var auth = /^\/(auth|login|signin|sign-in|signup|sign-up|register|reset-password)(\/|$)/.test(p);
        var m = localStorage.getItem('megsy_theme') || 'light';
        var dark = auth || m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var h = document.documentElement;
        h.classList.add(dark ? 'dark' : 'light');
        h.setAttribute('data-theme', dark ? 'dark' : 'light');
        h.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <body>
    <!-- Global SVG filter used by liquid-glass surfaces (.gemini-glass-tile, plus sheet). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="megsy-glass-warp" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>

    <!-- Speculation Rules API (Chromium 111+): registered from JS so weak
         devices, Data Saver and slow networks are skipped entirely — a full
         prerender is a second page render and it used to run on every hover,
         which slowed the *current* page down on low-end hardware. Injected
         after load so it never competes with the first paint. -->
    <script>
      (function () {
        try {
          if (!HTMLScriptElement.supports?.("speculationrules")) return;
          var nav = navigator;
          var c = nav.connection || {};
          var slow = c.saveData === true || /(^|-)(2g|slow-2g)$/.test(c.effectiveType || "");
          var weak = (nav.hardwareConcurrency || 8) <= 4 || (nav.deviceMemory || 8) <= 4;
          if (slow || weak) return;
          var add = function () {
            var s = document.createElement("script");
            s.type = "speculationrules";
            s.textContent = JSON.stringify({
              prerender: [
                {
                  source: "document",
                  where: {
                    and: [
                      { href_matches: "/*" },
                      { not: { href_matches: "/api/*" } },
                      { not: { href_matches: "/auth/*" } },
                    ],
                  },
                  eagerness: "moderate",
                },
              ],
              prefetch: [
                { source: "document", where: { href_matches: "/*" }, eagerness: "conservative" },
              ],
            });
            document.body.appendChild(s);
          };
          if (document.readyState === "complete") setTimeout(add, 1200);
          else addEventListener("load", function () { setTimeout(add, 1200); });
        } catch (e) {}
      })();
    </script>
